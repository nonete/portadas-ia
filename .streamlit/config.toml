# Colores generales de la web.
# base = "light" hace que se vea siempre clara, aunque el móvil esté en modo oscuro.

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "sans serif"

# Esconde el menú y los iconos de arriba a la derecha (entre ellos, el de GitHub).
[client]
toolbarMode = "minimal"
