name: Publicar web estática

# Crea la web estática (web/generar.py) y la sube a Cloudflare.
# Se lanza de tres formas:
#  - al terminar "Actualizar portadas" (workflow_call),
#  - al cambiar algo de la carpeta web/ en la rama main,
#  - a mano desde la pestaña Actions.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar-web.yml"]

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Los dos secretos de la página de configuración (web/worker/index.js).
      CLAVE_CONFIGURACION: ${{ secrets.CLAVE_CONFIGURACION }}
      GITHUB_TOKEN_CONFIG: ${{ secrets.GITHUB_TOKEN_CONFIG }}
    steps:
      # ref: main → se usa siempre lo último, con los datos recién guardados.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow dibuja la imagen que sale al compartir cada país en redes.
      - name: Instalar Pillow
        run: pip install pillow

      - name: Crear las páginas
        run: python web/generar.py

      - name: Avisar si faltan las claves de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Faltan los Secrets CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID. No se publica."

      - name: Subir a Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4"
          command: deploy

      # Copia a Cloudflare los secretos de la página de configuración.
      - name: Guardar en Cloudflare las claves de la página de configuración
        if: env.CLOUDFLARE_API_TOKEN != '' && (env.CLAVE_CONFIGURACION != '' || env.GITHUB_TOKEN_CONFIG != '')
        working-directory: web
        run: |
          python - <<'FIN'
          import json, os
          # Solo se copian los que estén puestos.
          claves = {nombre: os.environ[nombre].strip()
                    for nombre in ("CLAVE_CONFIGURACION", "GITHUB_TOKEN_CONFIG") if os.environ.get(nombre, "").strip()}
          json.dump(claves, open("claves.json", "w"))
          FIN
          npx --yes wrangler@4 secret bulk claves.json
          rm claves.json
