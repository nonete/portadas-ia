name: Actualizar portadas

on:
  schedule:
    # GitHub usa hora UTC. Madrid va 1 hora por delante en invierno y 2 en verano,
    # así que se lanza en las dos posibilidades y actualizar.py decide si toca.
    # Resultado: 8:00 y 18:00 hora de Madrid.
    - cron: "3 6,7,16,17 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacer también los países que ya tienen hecho este turno"
        type: boolean
        default: true
      pais:
        description: "Solo un país (es, fr, us, gb, de, it, ru, cn, br, eg, lr). Vacío = todos"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leer portadas y analizarlas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forzar && '1' || '0' }}
          PAIS: ${{ inputs.pais }}
        run: python actualizar.py

      - name: Buscar noticias de discapacidad y resumirlas
        # always(): se hace aunque algún país haya fallado en el paso anterior.
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # Si se ha pedido un solo país, Discapacidad no se rehace.
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forzar && inputs.pais == '' && '1' || '0' }}
        run: python actualizar_discapacidad.py

      - name: Guardar los datos en el repositorio
        # always(): si un país falla, los datos de los demás se guardan igual.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Datos: actualización automática"
            # Por si alguien ha cambiado algo en el repositorio mientras tanto
            # (por ejemplo, un prompt desde la página de configuración).
            git pull --rebase origin main
            git push
          fi

  # Después de guardar los datos se vuelve a crear y publicar la web estática.
  # always(): se publica aunque algún país haya fallado.
  publicar:
    needs: actualizar
    if: always()
    uses: ./.github/workflows/publicar-web.yml
    secrets: inherit
